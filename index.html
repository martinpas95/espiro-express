<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espiro Express</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#ffffff;
    --surface:#f6f9f8;
    --ink:#111b1a;
    --ink-soft:#6b7c7a;
    --line:#dde6e4;
    --accent:#0f7c85;
    --accent-strong:#0a5960;
    --accent-ink:#ffffff;
    --danger:#a92318;
    --danger-bg:#fdeeec;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Libre Franklin",system-ui,-apple-system,Segoe UI,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 16px;
    padding-top:14vh;
    padding-bottom:40px;
    min-height:100vh;
  }

  .topbar{ position:fixed; top:14px; right:16px; }
  .gear{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--bg);
    color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .gear:hover{ color:var(--accent); border-color:var(--accent); }
  .gear svg{ width:16px; height:16px; }

  .mark{
    font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:28px;
  }

  .zone{
    width:100%; max-width:440px;
    border:2px dashed var(--line);
    border-radius:16px;
    padding:40px 28px;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .zone:hover, .zone:focus-visible, .zone.drag{ border-color:var(--accent); background:var(--surface); outline:none; }

  .icon{ width:34px; height:34px; color:var(--accent); }
  .zone.busy .icon{ animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.35} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce){ .zone.busy .icon{ animation:none; } }

  .main{ font-size:15px; font-weight:600; color:var(--ink); }
  .sub{ font-size:13px; color:var(--ink-soft); }

  .line{
    font:600 15px/1.6 "JetBrains Mono",ui-monospace,monospace;
    color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; white-space:pre-wrap; word-break:break-word; width:100%;
  }
  .zone.error .line{ color:var(--danger); background:var(--danger-bg); border-color:var(--danger-bg); font-family:"Libre Franklin",sans-serif; font-weight:500; }

  .copy-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    font:inherit; font-size:14.5px; font-weight:700; padding:11px 22px; cursor:pointer;
    transition:background .15s, transform .05s;
  }
  .copy-btn:hover{ background:var(--accent-strong); }
  .copy-btn:active{ transform:scale(.97); }

  .reset-btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:none; border:1px solid var(--line); color:var(--ink-soft); border-radius:999px;
    font:inherit; font-size:13px; font-weight:600; padding:8px 16px; cursor:pointer;
    margin-top:4px; transition:border-color .15s, color .15s;
  }
  .reset-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }

  .again{ font-size:12.5px; color:var(--ink-soft); }

  .foot{ margin-top:28px; max-width:440px; font-size:11.5px; line-height:1.6; color:var(--ink-soft); text-align:center; }
  .foot a{ color:var(--ink-soft); }

  input[type=file]{ display:none; }

  .keybox{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:10px; }
  .keybox input[type=password]{
    font:500 14px "JetBrains Mono",ui-monospace,monospace; padding:11px 13px;
    border:1px solid var(--line); border-radius:10px; width:100%;
  }
  .keybox input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .link-btn{ background:none; border:none; color:var(--ink-soft); font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }

  @media (max-width:420px){
    body{ padding-top:9vh; }
    .zone{ padding:32px 20px; }
  }
</style>
</head>
<body>

<div class="topbar"><button class="gear" id="gearBtn" type="button" aria-label="Configurar clave de API" title="Configurar clave de API">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button></div>

<div class="mark">Espiro Express</div>

<div id="app"></div>

<p class="foot" id="foot">Solo pegar o adjuntar — la lectura y el cálculo son automáticos. Revisá la línea antes de pegarla en la HC.</p>

<script>
(function(){
  var app = document.getElementById('app');
  var foot = document.getElementById('foot');
  var STORAGE_KEY = 'espiroExpressApiKey';
  var MODEL = 'gemini-3.5-flash-lite';

  var PROMPT = 'Sos un asistente que lee informes de espirometria de laboratorios de funcion pulmonar (unidades BTPS, teoricos Knudson o NHANES III). Te paso una imagen con la tabla de resultados, que puede incluir una prueba PRE y otra POST broncodilatador.\n\n' +
    'Extrae estos datos de la tabla y respondé SOLO con un objeto JSON, sin texto adicional ni explicaciones, con esta forma exacta:\n\n' +
    '{\n' +
    '  "fecha": string,            // fecha de la prueba PRE, tal cual aparece en el informe\n' +
    '  "fev1_fvc_pct": number,     // fila FEV1/FVC, columna "Best" (nunca PRE #1/#2/#3), en %\n' +
    '  "fev1_L": number,           // fila FEV1, columna "Best" (nunca PRE #1/#2/#3), en litros\n' +
    '  "fev1_pct_teor": number,    // fila FEV1, columna "%Teor." asociada al valor Best (entero)\n' +
    '  "fev1_z": number,           // fila FEV1, columna "Z-score" asociada al valor Best\n' +
    '  "fvc_L": number,            // fila FVC, columna "Best" (nunca PRE #1/#2/#3), en litros\n' +
    '  "fvc_pct_teor": number,     // fila FVC, columna "%Teor." asociada al valor Best (entero)\n' +
    '  "fvc_z": number,            // fila FVC, columna "Z-score" asociada al valor Best\n' +
    '  "tiene_post": boolean,      // true si existe una columna POST con valor de FEV1\n' +
    '  "fev1_predicho_L": number,  // fila FEV1, columna "Teor." (valor teorico/predicho en litros, NO %Teor.), o null si no se ve\n' +
    '  "fev1_post_L": number       // fila FEV1, columna POST, en litros, o null si no hay prueba post-broncodilatador\n' +
    '}\n\n' +
    'Usá siempre la columna "Best" para los valores de FEV1, FVC y FEV1/FVC (nunca PRE #1, #2 o #3, aunque coincidan con Best). Si un dato no se puede leer con confianza, usa null en ese campo. No inventes valores.';

  function getKey(){ try{ return localStorage.getItem(STORAGE_KEY) || ''; }catch(e){ return ''; } }
  function setKey(k){ try{ localStorage.setItem(STORAGE_KEY, k); }catch(e){} }
  function clearKey(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

  function normalizeDate(raw){
    if(!raw) return '';
    var m = String(raw).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(!m) return String(raw).trim();
    var d = m[1].padStart(2,'0'), mo = m[2].padStart(2,'0'), y = m[3];
    y = y.length === 4 ? y.slice(2) : y.padStart(2,'0');
    return d + '/' + mo + '/' + y;
  }

  function computeLine(d){
    var date = normalizeDate(d.fecha) || String(d.fecha || '').trim();
    var ratio = Number(d.fev1_fvc_pct);
    var fev1L = Number(d.fev1_L);
    var fev1Pct = Number(d.fev1_pct_teor);
    var fev1Z = Number(d.fev1_z);
    var fvcL = Number(d.fvc_L);
    var fvcPct = Number(d.fvc_pct_teor);
    var fvcZ = Number(d.fvc_z);
    var req = [ratio, fev1L, fev1Pct, fev1Z, fvcL, fvcPct, fvcZ];
    if(!date || req.some(function(v){ return Number.isNaN(v); })) return null;

    var line = 'Espirometria ' + date + ': FEV1/FVC: ' + Math.round(ratio) + '%, ' +
      'FEV1: ' + fev1L.toFixed(2) + 'L (' + Math.round(fev1Pct) + '%) ' + fev1Z.toFixed(2) + ', ' +
      'FVC: ' + fvcL.toFixed(2) + 'L (' + Math.round(fvcPct) + '%) ' + fvcZ.toFixed(2);

    if(d.tiene_post && d.fev1_post_L != null && d.fev1_predicho_L != null){
      var predL = Number(d.fev1_predicho_L), postL = Number(d.fev1_post_L);
      if(!Number.isNaN(predL) && !Number.isNaN(postL) && predL > 0){
        var bdr = (postL - fev1L) / predL * 100;
        if(bdr > 10) line += ' +' + Math.round(bdr) + '% postb2';
      }
    }
    return line;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; });
  }

  function copyText(text, btn){
    function ok(){ if(btn){ var prev = btn.textContent; btn.textContent = '¡Copiado!'; setTimeout(function(){ btn.textContent = prev; }, 1400); } }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(function(){ fallbackCopy(text, ok); });
    } else { fallbackCopy(text, ok); }
  }
  function fallbackCopy(text, cb){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); cb();
    }catch(e){}
  }

  // ---- API key setup screen ----
  function renderKeySetup(){
    foot.textContent = 'Tu clave se guarda solo en este navegador. Nunca se envía a otro lado salvo a Google (gratis, sin tarjeta).';
    app.innerHTML =
      '<div class="keybox">' +
        '<div class="main" style="text-align:center">Configurá tu clave gratuita de Gemini</div>' +
        '<input type="password" id="keyInput" placeholder="AIza...">' +
        '<button class="copy-btn" id="saveKeyBtn" type="button">Guardar y empezar</button>' +
        '<div style="text-align:center"><a class="link-btn" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Conseguir una clave gratis en aistudio.google.com →</a></div>' +
      '</div>';
    document.getElementById('saveKeyBtn').addEventListener('click', function(){
      var v = document.getElementById('keyInput').value.trim();
      if(!v) return;
      setKey(v);
      renderZone();
    });
  }

  // ---- gear (change/clear key) ----
  document.getElementById('gearBtn').addEventListener('click', function(){
    var current = getKey();
    var next = window.prompt('Clave de API de Gemini (dejar vacío para borrar):', current);
    if(next === null) return;
    next = next.trim();
    if(!next){ clearKey(); renderKeySetup(); }
    else { setKey(next); renderZone(); }
  });

  // ---- main paste/attach zone ----
  function renderZone(){
    foot.textContent = 'Solo pegar o adjuntar — la lectura y el cálculo son automáticos. Revisá la línea antes de pegarla en la HC.';
    app.innerHTML =
      '<div class="zone" id="zone" tabindex="0" role="button" aria-label="Pegar o adjuntar imagen o PDF de la espirometría">' +
        idleInner() +
      '</div>' +
      '<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf">';
    wireZone();
  }

  function idleInner(){
    return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>' +
      '<div class="main">Ctrl+V para pegar la captura</div>' +
      '<div class="sub">o hacé clic para adjuntar imagen o PDF</div>';
  }

  function wireZone(){
    var zone = document.getElementById('zone');
    var fileInput = document.getElementById('fileInput');

    zone.addEventListener('click', function(){ fileInput.click(); });
    zone.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); } });
    fileInput.addEventListener('change', function(){ if(this.files && this.files[0]) handleFile(this.files[0]); this.value = ''; });
    ['dragover','dragenter'].forEach(function(evt){ zone.addEventListener(evt, function(e){ e.preventDefault(); zone.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(evt){ zone.addEventListener(evt, function(){ zone.classList.remove('drag'); }); });
    zone.addEventListener('drop', function(e){
      e.preventDefault();
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) handleFile(f);
    });
  }

  window.addEventListener('paste', function(e){
    var zone = document.getElementById('zone');
    if(!zone) return;
    var items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf('image/') === 0){
        var blob = items[i].getAsFile();
        if(blob){ handleFile(blob); e.preventDefault(); }
        break;
      }
    }
  });

  var PAGE_TITLE = document.title;
  window.addEventListener('focus', function(){ document.title = PAGE_TITLE; });

  function beep(ok){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = ok ? 880 : 300;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
      o.start();
      o.stop(ctx.currentTime + 0.24);
      o.onended = function(){ ctx.close(); };
    }catch(e){}
  }

  var busyTimer = null;
  function renderBusy(){
    document.title = PAGE_TITLE;
    clearInterval(busyTimer);
    var zone = document.getElementById('zone'); if(!zone) return;
    zone.className = 'zone busy';
    zone.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>' +
      '<div class="main">Leyendo la espirometría…</div><div class="sub" id="busySub">Podés seguir trabajando — te avisa solo cuando esté (0s)</div>';
    var start = Date.now();
    busyTimer = setInterval(function(){
      var sub = document.getElementById('busySub');
      if(!sub){ clearInterval(busyTimer); return; }
      sub.textContent = 'Podés seguir trabajando — te avisa solo cuando esté (' + Math.round((Date.now() - start) / 1000) + 's)';
    }, 1000);
  }
  function renderDone(line){
    clearInterval(busyTimer);
    document.title = '✔ Listo para copiar — ' + PAGE_TITLE;
    beep(true);
    var zone = document.getElementById('zone'); if(!zone) return;
    zone.className = 'zone done';
    zone.innerHTML = '<div class="line">' + escapeHtml(line) + '</div>' +
      '<button class="copy-btn" type="button" id="copyBtn">Copiar línea</button>' +
      '<button class="reset-btn" type="button" id="resetBtn">↺ Reiniciar</button>' +
      '<div class="again">Ya se copió sola — pegá, adjuntá otra imagen o reiniciá para el próximo paciente</div>';
    document.getElementById('copyBtn').addEventListener('click', function(e){ e.stopPropagation(); copyText(line, this); });
    document.getElementById('resetBtn').addEventListener('click', function(e){ e.stopPropagation(); resetZone(); });
    try{ navigator.clipboard && navigator.clipboard.writeText && navigator.clipboard.writeText(line).catch(function(){}); }catch(e){}
  }
  function renderErr(msg){
    clearInterval(busyTimer);
    document.title = '⚠ Revisar — ' + PAGE_TITLE;
    beep(false);
    var zone = document.getElementById('zone'); if(!zone) return;
    zone.className = 'zone error';
    zone.innerHTML = '<div class="line">' + escapeHtml(msg) + '</div>' +
      '<button class="reset-btn" type="button" id="resetBtn">↺ Reiniciar</button>' +
      '<div class="again">Hacé clic, pegá de nuevo o reiniciá para reintentar</div>';
    document.getElementById('resetBtn').addEventListener('click', function(e){ e.stopPropagation(); resetZone(); });
  }
  function resetZone(){
    clearInterval(busyTimer);
    document.title = PAGE_TITLE;
    var zone = document.getElementById('zone'); if(!zone) return;
    zone.className = 'zone';
    zone.innerHTML = idleInner();
  }

  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function prepareImage(blob){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        var maxDim = 900;
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(outBlob){
          blobToBase64(outBlob).then(function(b64){ resolve({ base64: b64, mediaType: 'image/jpeg' }); });
        }, 'image/jpeg', 0.88);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(blob);
    });
  }

  function pdfFirstPageToBlob(file){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({ data: buf }).promise;
    }).then(function(pdf){ return pdf.getPage(1); }).then(function(page){
      var viewport = page.getViewport({ scale: 2 });
      var canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      var ctx = canvas.getContext('2d');
      return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
        return new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
      });
    });
  }

  function extractJson(text){
    var t = text.trim();
    var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if(fence) t = fence[1].trim();
    var start = t.indexOf('{'), end = t.lastIndexOf('}');
    if(start === -1 || end === -1) throw new Error('no-json');
    return JSON.parse(t.slice(start, end + 1));
  }

  function callGemini(apiKey, base64, mediaType, signal){
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent?key=' + encodeURIComponent(apiKey);
    return fetch(url, {
      method: 'POST',
      signal: signal,
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: PROMPT },
            { inline_data: { mime_type: mediaType, data: base64 } }
          ]
        }],
        generationConfig: {
          responseMimeType: 'application/json',
          maxOutputTokens: 400
        }
      })
    }).then(function(res){
      if(!res.ok){
        return res.json().catch(function(){ return {}; }).then(function(body){
          var err = new Error((body.error && body.error.message) || ('HTTP ' + res.status));
          err.status = res.status;
          throw err;
        });
      }
      return res.json();
    }).then(function(data){
      var cand = data.candidates && data.candidates[0];
      var parts = cand && cand.content && cand.content.parts || [];
      return parts.map(function(p){ return p.text || ''; }).join('');
    });
  }

  function errorMessageFor(err){
    if(err && err.status === 403) return 'Clave de API inválida o sin permiso — hacé clic en el engranaje (arriba a la derecha) para corregirla.';
    if(err && err.status === 400) return 'La API rechazó el pedido (' + (err.message || 'motivo desconocido') + ') — revisá la clave o probá de nuevo.';
    if(err && err.status === 404) return 'El modelo no está disponible con esta clave — hacé clic en el engranaje y revisá la clave.';
    if(err && err.status === 429) return 'Alcanzaste el límite gratuito por ahora — esperá un momento y probá de nuevo.';
    if(err && err.message === 'no-json') return 'No se pudo interpretar la respuesta. Probá de nuevo.';
    if(err && err.name === 'AbortError') return 'Tardó más de 15s y se cortó (wifi lenta o el servidor no responde) — probá de nuevo.';
    if(err && /Failed to fetch/i.test(err.message || '')) return 'No hay conexión con el servidor de Gemini. Revisá tu internet.';
    return 'No se pudo leer la imagen (' + (err && err.message ? err.message : 'error desconocido') + ').';
  }

  function handleFile(file){
    var apiKey = getKey();
    if(!apiKey){ renderKeySetup(); return; }
    renderBusy();
    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 15000);
    Promise.resolve().then(function(){
      if(file.type === 'application/pdf') return pdfFirstPageToBlob(file);
      return file;
    }).then(function(blob){
      return prepareImage(blob);
    }).then(function(prepared){
      return callGemini(apiKey, prepared.base64, prepared.mediaType, controller.signal);
    }).then(function(text){
      clearTimeout(timeoutId);
      var data = extractJson(text);
      var line = computeLine(data);
      if(!line){ renderErr('No se pudieron leer todos los valores con confianza — probá con una captura más clara y completa.'); return; }
      renderDone(line);
    }).catch(function(err){
      clearTimeout(timeoutId);
      renderErr(errorMessageFor(err));
    });
  }

  // ---- boot ----
  if(getKey()) renderZone(); else renderKeySetup();
})();
</script>
</body>
</html>
